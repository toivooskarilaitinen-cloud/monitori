name: Collect MONITORI data

on:
  workflow_dispatch:
  schedule:
    - cron: "7 0,6,12,18 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Collect sensor data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/collect.py
      - name: Commit observations
        run: |
          git config user.name "vaimea-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: MONITORI observation $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
